<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f0f">
    <title>🎚️ Dual Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            overscroll-behavior: none;
            overflow: hidden;
            height: 100%;
            position: fixed;
            width: 100%;
            background: var(--bg);
        }
        :root {
            --bg: #f5f5f0;
            --bg2: #fff;
            --border: #b0b0b0;
            --border2: #888;
            --text: #1a1a1a;
            --text2: #555;
            --text3: #888;
            --text4: #aaa;
            --badge-bg: #f0f0f0;
            --badge-text: #666;
            --input-bg: #fff;
            --hover: #f5f5f5;
            --primary: #1a1a1a;
            --primary-text: #fff;
            --slider-track: #d0d0d0;
            --slider-thumb: #1a1a1a;
        }
        body.dark {
            --bg: #0f0f0f;
            --bg2: #1c1c1e;
            --border: #2c2c2e;
            --border2: #3a3a3c;
            --text: #f0f0f0;
            --text2: #aaa;
            --text3: #777;
            --text4: #555;
            --badge-bg: #2c2c2e;
            --badge-text: #aaa;
            --input-bg: #1c1c1e;
            --hover: #2c2c2e;
            --primary: #f0f0f0;
            --primary-text: #0f0f0f;
            --slider-track: #3a3a3c;
            --slider-thumb: #f0f0f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            transition: background .2s, color .2s;
        }
        .app {
            width: 800px;
            margin: 0 auto;
            padding: 12px 16px;
            height: 100vh;
            overflow-y: auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            gap: 8px;
        }
        h1 { font-size: 20px; font-weight: 500; }
        .header-btns { display: flex; align-items: center; gap: 6px; }
        .card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .btn, .sq-btn {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 13px;
            line-height: 1.2;
            cursor: pointer;
            color: var(--text);
            transition: all .15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            gap: 6px;
        }
        .btn:hover, .sq-btn:hover { background: var(--hover); }
        .btn-primary {
            background: var(--primary);
            color: var(--primary-text);
            border-color: var(--primary);
            font-weight: 500;
        }
        .sq-btn {
            width: 38px;
            height: 32px;
            padding: 0;
            font-size: 16px;
            flex-shrink: 0;
        }
        input[type="text"] {
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border2);
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            width: 100%;
            transition: border .15s;
        }
        input[type="text"]:focus { border-color: var(--primary); }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .video-label {
            font-size: 12px;
            color: var(--text3);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .video-label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            background: var(--border2);
            transition: background .2s;
        }
        .video-label .dot.playing {
            background: #6fcf6f;
            box-shadow: 0 0 6px rgba(111,207,111,.5);
        }
        .crossfader-section {
            position: relative;
            padding: 18px 8px 14px;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .crossfader-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text4);
            margin-bottom: 6px;
            letter-spacing: .3px;
        }
        .crossfader-labels span.active-label { color: var(--text2); font-weight: 600; }
        input[type="range"].crossfader-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 8%27 preserveAspectRatio=%27none%27%3E%3Cdefs%3E%3Cpattern id=%27p%27 width=%275%27 height=%278%27 patternUnits=%27userSpaceOnUse%27%3E%3Cline x1=%272.5%27 y1=%272%27 x2=%272.5%27 y2=%276%27 stroke=%27currentColor%27 stroke-width=%271%27/%3E%3C/pattern%3E%3C/defs%3E%3Crect width=%27100%27 height=%278%27 fill=%27url(%23p)%27/%3E%3Cline x1=%270%27 y1=%270%27 x2=%270%27 y2=%278%27 stroke=%27currentColor%27 stroke-width=%271.5%27/%3E%3Cline x1=%2725%27 y1=%270%27 x2=%2725%27 y2=%278%27 stroke=%27currentColor%27 stroke-width=%271.5%27/%3E%3Cline x1=%2750%27 y1=%270%27 x2=%2750%27 y2=%278%27 stroke=%27currentColor%27 stroke-width=%271.5%27/%3E%3Cline x1=%2775%27 y1=%270%27 x2=%2775%27 y2=%278%27 stroke=%27currentColor%27 stroke-width=%271.5%27/%3E%3Cline x1=%27100%27 y1=%270%27 x2=%27100%27 y2=%278%27 stroke=%27currentColor%27 stroke-width=%271.5%27/%3E%3C/svg%3E') 0 0/100% 100% no-repeat, var(--slider-track);
            color: var(--text3);
            outline: none;
            cursor: pointer;
            margin: 0;
            touch-action: none;
        }
        input[type="range"].crossfader-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 30px;
            border-radius: 4px;
            background: var(--slider-thumb);
            border: 2px solid var(--bg2);
            box-shadow: 0 2px 8px rgba(0,0,0,.35);
            cursor: grab;
            transition: background .2s, transform .1s;
        }
        input[type="range"].crossfader-slider::-webkit-slider-thumb:active {
            cursor: grabbing;
            transform: scale(1.05);
        }
        input[type="range"].crossfader-slider::-moz-range-thumb {
            width: 11px;
            height: 30px;
            border-radius: 4px;
            background: var(--slider-thumb);
            border: 2px solid var(--bg2);
            box-shadow: 0 2px 8px rgba(0,0,0,.35);
            cursor: grab;
        }
        input[type="range"].crossfader-slider.at-middle::-webkit-slider-thumb {
            background: #888;
            border-color: #666;
        }
        input[type="range"].crossfader-slider.at-middle::-moz-range-thumb {
            background: #888;
            border-color: #666;
        }
        .volume-indicator {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text3);
            margin-top: 11px;
            font-variant-numeric: tabular-nums;
            font-family: monospace;
        }
        .url-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        .url-row input { flex: 1; }
        .badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 6px;
            background: var(--badge-bg);
            color: var(--badge-text);
            display: inline-flex;
            align-items: center;
            line-height: 1.4;
            height: 26px;
            border: 1px solid var(--border2);
            gap: 4px;
        }
        .badge-green { background: #1a3a1a; color: #6fcf6f; border-color: #2d5a2d; }
        .badge-red { background: #3a1a1a; color: #cf6f6f; border-color: #5a2d2d; }
        body:not(.dark) .badge-green { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
        body:not(.dark) .badge-red { background: #fdecea; color: #c62828; border-color: #ef9a9a; }
        .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .gap-12 { gap: 12px; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-4 { margin-bottom: 4px; }
        .mb-8 { margin-bottom: 8px; }
        .flex-1 { flex: 1; }
        .text-small { font-size: 11px; color: var(--text4); }
        .text-center { text-align: center; }

        /* Popup */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .overlay.show { display: flex; }
        .overlay.top { z-index: 10001; }
        .popup-box {
            background: var(--bg2);
            border-radius: 14px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .popup-box h2 { margin-bottom: 20px; font-size: 18px; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        #versionInfo {
            display: none;
            font-size: 11px;
            color: var(--text4);
            margin-top: 12px;
            text-align: right;
        }
    </style>
</head>
<body class="dark">
    <div class="app">
        <div class="header">
            <div class="header-left"><h1>🎚️ Dual Player</h1></div>
            <div class="header-btns">
                <button class="sq-btn" id="darkBtn">🌓</button>
                <button class="sq-btn" id="settingsBtn">🛠️</button>
            </div>
        </div>

        <div class="card">
            <div class="video-label mb-4"><span class="dot" id="dot1"></span> Video 1 (oben)</div>
            <div class="url-row mb-8">
                <input type="text" id="url1" placeholder="YouTube-URL oder Video-ID…" value="https://www.youtube.com/watch?v=pvtuBb1aOMw&list=RDpvtuBb1aOMw&start_radio=1">
                <button class="sq-btn" id="pasteBtn1">📋</button>
            </div>
            <div class="video-label mb-4"><span class="dot" id="dot2"></span> Video 2 (unten)</div>
            <div class="url-row mb-8">
                <input type="text" id="url2" placeholder="YouTube-URL oder Video-ID…" value="https://www.youtube.com/watch?v=xMmhAEI1iQI">
                <button class="sq-btn" id="pasteBtn2">📋</button>
            </div>
            <div class="row gap-12">
                <button class="btn btn-primary" id="loadBtn">📺 Videos laden</button>
                <button class="btn" id="playPauseBtn">▶️ Play</button>
                <span class="badge" id="statusBadge">⏳ Bereit</span>
            </div>
        </div>

        <div class="video-label mb-4"><span class="dot" id="dot1b"></span> Oben</div>
        <div class="video-wrapper mb-8" id="player1Container">
            <div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:14px">⬆️ Video hier laden</div>
        </div>

        <div class="crossfader-section">
            <div class="crossfader-labels">
                <span id="labelTop">🔊 Nur oben</span>
                <span id="labelMid"></span>
                <span id="labelBottom">🔊 Nur unten</span>
            </div>
            <input type="range" class="crossfader-slider" id="crossfader" min="0" max="100" value="50" step="1">
            <div class="volume-indicator">
                <span id="volTopDisplay">Vol. oben: 50%</span>
                <span id="volBottomDisplay">Vol. unten: 50%</span>
            </div>
        </div>

        <div class="video-label mb-4"><span class="dot" id="dot2b"></span> Unten</div>
        <div class="video-wrapper" id="player2Container">
            <div style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:14px">⬇️ Video hier laden</div>
        </div>

        <div id="versionInfo">v0.022</div>
    </div>

    <!-- Settings Popup -->
    <div class="overlay" id="settingsPopup" onclick="if(event.target===this) window.closePopup(this)">
        <div class="popup-box">
            <h2>Einstellungen</h2>
            <div class="setting-row">
                <span>Version anzeigen</span>
                <input type="checkbox" id="settingShowVersion">
            </div>
            <button class="btn" style="background:#fff;color:#000;border-color:#000;margin-top:8px;" onclick="window.closePopup(document.getElementById('settingsPopup'))">Okay</button>
        </div>
    </div>

    <!-- PWA Icon & Manifest -->
    <script>
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 192; canvas.height = 192;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f0f0f'; ctx.fillRect(0,0,192,192);
            ctx.fillStyle = '#f0f0f0'; ctx.font = '120px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🎚️', 96, 106);
            const iconUrl = canvas.toDataURL('image/png');
            const manifest = { name:'Dual Player', short_name:'DualPlayer', display:'standalone', background_color:'#0f0f0f', theme_color:'#0f0f0f', icons:[{src:iconUrl,sizes:'192x192',type:'image/png'}] };
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
            document.head.appendChild(link);
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            const swCode = "self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => e.waitUntil(clients.claim())); self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));";
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }
    </script>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        (function() {
            // Popup-Management (global)
            let popupStack = [];
            window.openPopup = function(id) {
                const p = document.getElementById(id);
                if (!p) return;
                p.classList.add('show');
                popupStack.push(id);
                history.pushState({popup:id}, '');
            };
            window.closePopup = function(popup) {
                if (!popup) return;
                popup.classList.remove('show');
                popupStack = popupStack.filter(id => id !== popup.id);
                if (popupStack.length > 0) history.back();
            };
            window.addEventListener('popstate', function(e) {
                if (popupStack.length > 0) {
                    const id = popupStack.pop();
                    const p = document.getElementById(id);
                    if (p) p.classList.remove('show');
                }
            });

            const APP_VERSION = 'v0.022';
            document.getElementById('versionInfo').textContent = APP_VERSION;

            document.getElementById('settingsBtn').addEventListener('click', () => window.openPopup('settingsPopup'));

            const settingShowVersion = document.getElementById('settingShowVersion');
            const versionInfo = document.getElementById('versionInfo');
            function applySettingsVisibility() {
                const show = settingShowVersion.checked;
                versionInfo.style.display = show ? 'block' : 'none';
                localStorage.setItem('setting_show_version', show);
            }
            settingShowVersion.addEventListener('change', applySettingsVisibility);
            (function initSettingsVisibility() {
                const saved = localStorage.getItem('setting_show_version');
                settingShowVersion.checked = saved === 'true';
                applySettingsVisibility();
            })();

            // Restliche App-Logik (unverändert)
            const $ = s => document.getElementById(s);
            const url1Input = $('url1'), url2Input = $('url2'), loadBtn = $('loadBtn'),
                  playPauseBtn = $('playPauseBtn'), crossfader = $('crossfader'),
                  statusBadge = $('statusBadge'), volTopDisplay = $('volTopDisplay'),
                  volBottomDisplay = $('volBottomDisplay'), labelTop = $('labelTop'),
                  labelMid = $('labelMid'), labelBottom = $('labelBottom'),
                  player1Container = $('player1Container'), player2Container = $('player2Container'),
                  darkBtn = $('darkBtn'), pasteBtn1 = $('pasteBtn1'), pasteBtn2 = $('pasteBtn2'),
                  dot1 = $('dot1'), dot2 = $('dot2'), dot1b = $('dot1b'), dot2b = $('dot2b');

            let player1 = null, player2 = null, apiReady = false, pendingLoad = false,
                isPlaying = false, crossfadeValue = 50;

            function extractVideoID(input) {
                const t = input.trim();
                if (!t) return null;
                if (/^[a-zA-Z0-9_-]{11}$/.test(t)) return t;
                try {
                    const url = new URL(t);
                    if (url.hostname === 'youtu.be') { const id = url.pathname.slice(1).split('/')[0]; if (/^[a-zA-Z0-9_-]{11}$/.test(id)) return id; }
                    if (url.hostname.includes('youtube.com')) { const v = url.searchParams.get('v'); if (v && /^[a-zA-Z0-9_-]{11}$/.test(v)) return v; }
                    if (url.pathname.startsWith('/embed/')) { const id = url.pathname.split('/embed/')[1].split('/')[0]; if (/^[a-zA-Z0-9_-]{11}$/.test(id)) return id; }
                    if (url.pathname.startsWith('/shorts/')) { const id = url.pathname.split('/shorts/')[1].split('/')[0]; if (/^[a-zA-Z0-9_-]{11}$/.test(id)) return id; }
                } catch(e) {}
                return null;
            }

            function createOrUpdatePlayer(num, videoID) {
                const containerId = num === 1 ? 'player1Container' : 'player2Container';
                const container = document.getElementById(containerId);
                if (num === 1 && player1 && typeof player1.destroy === 'function') { player1.destroy(); player1 = null; }
                if (num === 2 && player2 && typeof player2.destroy === 'function') { player2.destroy(); player2 = null; }
                container.innerHTML = '';
                const inner = document.createElement('div');
                inner.id = containerId + '_inner';
                inner.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
                container.appendChild(inner);
                const player = new YT.Player(inner.id, {
                    videoId: videoID,
                    playerVars: { autoplay:0, controls:1, modestbranding:1, rel:0, playsinline:1, enablejsapi:1, origin:window.location.origin, hl:'de', vq:'medium' },
                    events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange, onError: onPlayerError }
                });
                if (num === 1) player1 = player; else player2 = player;
            }

            function onPlayerReady(event) { applyVolume(event.target); updateStatusBadge(); }
            function onPlayerStateChange(event) {
                const player = event.target;
                const state = player.getPlayerState();
                if (state === 1) {
                    if (!isPlaying) { isPlaying = true; updatePlayPauseButton(); }
                    applyVolume(player); updateDots(true, player);
                } else if (state === 2 || state === 0 || state === 5 || state === -1) {
                    updateDots(false, player);
                    const p1 = player1 && player1.getPlayerState && player1.getPlayerState() === 1;
                    const p2 = player2 && player2.getPlayerState && player2.getPlayerState() === 1;
                    if (!p1 && !p2 && isPlaying) { isPlaying = false; updatePlayPauseButton(); }
                    updateStatusBadge();
                }
            }
            function onPlayerError(event) {
                const which = event.target === player1 ? 'Video 1 (oben)' : 'Video 2 (unten)';
                statusBadge.textContent = '⚠️ Fehler bei ' + which;
                statusBadge.className = 'badge badge-red';
            }

            function updateDots(playing, player) {
                const isP1 = player === player1;
                const d1 = isP1 ? dot1 : dot2, d2 = isP1 ? dot1b : dot2b;
                if (playing) { d1.classList.add('playing'); d2.classList.add('playing'); }
                else { d1.classList.remove('playing'); d2.classList.remove('playing'); }
            }

            function getVolumes() { return { volTop: Math.round(100 - crossfadeValue), volBottom: Math.round(crossfadeValue) }; }
            function applyVolume(player) {
                if (!player || typeof player.setVolume !== 'function') return;
                const { volTop, volBottom } = getVolumes();
                if (player === player1) player.setVolume(volTop); else if (player === player2) player.setVolume(volBottom);
            }
            function applyAllVolumes() {
                if (player1 && typeof player1.setVolume === 'function') applyVolume(player1);
                if (player2 && typeof player2.setVolume === 'function') applyVolume(player2);
                updateVolumeDisplay(); updateMiddleHighlight();
            }
            function updateVolumeDisplay() {
                const { volTop, volBottom } = getVolumes();
                volTopDisplay.textContent = 'Vol. oben: ' + volTop + '%';
                volBottomDisplay.textContent = 'Vol. unten: ' + volBottom + '%';
                const v = crossfadeValue;
                labelTop.classList.toggle('active-label', v === 0);
                labelMid.classList.toggle('active-label', v === 50);
                labelBottom.classList.toggle('active-label', v === 100);
            }
            function updateMiddleHighlight() { crossfader.classList.toggle('at-middle', crossfadeValue === 50); }
            function updateStatusBadge() {
                const p1r = player1 && typeof player1.getPlayerState === 'function';
                const p2r = player2 && typeof player2.getPlayerState === 'function';
                const s1 = p1r ? player1.getPlayerState() : -2;
                const s2 = p2r ? player2.getPlayerState() : -2;
                if (!p1r && !p2r) { statusBadge.textContent = '⏳ Keine Videos geladen'; statusBadge.className = 'badge'; }
                else if (s1 === 1 && s2 === 1) { statusBadge.textContent = '▶️ Beide spielen'; statusBadge.className = 'badge badge-green'; }
                else if (s1 === 1 || s2 === 1) { statusBadge.textContent = '▶️ Eines spielt'; statusBadge.className = 'badge badge-green'; }
                else if (s1 === 2 || s2 === 2) { statusBadge.textContent = '⏸️ Pausiert'; statusBadge.className = 'badge'; }
                else if (s1 === 3 || s2 === 3) { statusBadge.textContent = '🔄 Buffering…'; statusBadge.className = 'badge'; }
                else { statusBadge.textContent = '✅ Bereit'; statusBadge.className = 'badge'; }
            }
            function updatePlayPauseButton() { playPauseBtn.innerHTML = isPlaying ? '⏸️ Pause' : '▶️ Play'; }
            function togglePlayPause() {
                const p1p = player1 && player1.getPlayerState && player1.getPlayerState() === 1;
                const p2p = player2 && player2.getPlayerState && player2.getPlayerState() === 1;
                if (isPlaying || p1p || p2p) {
                    if (player1 && typeof player1.pauseVideo === 'function') player1.pauseVideo();
                    if (player2 && typeof player2.pauseVideo === 'function') player2.pauseVideo();
                    isPlaying = false;
                } else {
                    if (player1 && typeof player1.playVideo === 'function') player1.playVideo();
                    if (player2 && typeof player2.playVideo === 'function') player2.playVideo();
                    isPlaying = true; applyAllVolumes();
                }
                updatePlayPauseButton(); updateStatusBadge(); updateDotsNow();
            }
            function updateDotsNow() {
                const p1 = player1 && player1.getPlayerState && player1.getPlayerState() === 1;
                const p2 = player2 && player2.getPlayerState && player2.getPlayerState() === 1;
                if (p1) { dot1.classList.add('playing'); dot1b.classList.add('playing'); } else { dot1.classList.remove('playing'); dot1b.classList.remove('playing'); }
                if (p2) { dot2.classList.add('playing'); dot2b.classList.add('playing'); } else { dot2.classList.remove('playing'); dot2b.classList.remove('playing'); }
            }
            function loadVideos() {
                const id1 = extractVideoID(url1Input.value), id2 = extractVideoID(url2Input.value);
                if (!id1 || !id2) { alert('Bitte gültige URLs eingeben.'); statusBadge.textContent = '❌ Ungültige URL'; statusBadge.className = 'badge badge-red'; return; }
                statusBadge.textContent = '🔄 Lade Videos…'; statusBadge.className = 'badge';
                isPlaying = false; updatePlayPauseButton();
                dot1.classList.remove('playing'); dot2.classList.remove('playing'); dot1b.classList.remove('playing'); dot2b.classList.remove('playing');
                if (apiReady) { createOrUpdatePlayer(1,id1); createOrUpdatePlayer(2,id2); statusBadge.textContent = '✅ Geladen'; statusBadge.className = 'badge'; }
                else { pendingLoad = {id1,id2}; statusBadge.textContent = '⏳ Warte auf YouTube API…'; }
            }
            window.onYouTubeIframeAPIReady = function() {
                apiReady = true;
                if (pendingLoad) { createOrUpdatePlayer(1,pendingLoad.id1); createOrUpdatePlayer(2,pendingLoad.id2); pendingLoad = null; statusBadge.textContent = '✅ Geladen'; statusBadge.className = 'badge'; }
            };

            crossfader.addEventListener('input', function() { crossfadeValue = parseInt(this.value,10); applyAllVolumes(); });
            darkBtn.addEventListener('click', function() {
                document.body.classList.toggle('dark');
                const isDark = document.body.classList.contains('dark');
                darkBtn.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('dualPlayerDarkMode', isDark ? 'dark' : 'light');
            });
            (function() { const saved = localStorage.getItem('dualPlayerDarkMode'); if (saved === 'light') { document.body.classList.remove('dark'); darkBtn.textContent = '🌙'; } else { document.body.classList.add('dark'); darkBtn.textContent = '☀️'; } })();
            pasteBtn1.addEventListener('click', async () => { try { const t = await navigator.clipboard.readText(); if (t) url1Input.value = t; } catch(e) { alert('Zwischenablage nicht lesbar.'); } });
            pasteBtn2.addEventListener('click', async () => { try { const t = await navigator.clipboard.readText(); if (t) url2Input.value = t; } catch(e) { alert('Zwischenablage nicht lesbar.'); } });
            loadBtn.addEventListener('click', loadVideos);
            playPauseBtn.addEventListener('click', togglePlayPause);
            document.addEventListener('keydown', function(e) {
                if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); togglePlayPause(); }
                if (e.code === 'ArrowLeft' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); crossfadeValue = Math.max(0, crossfadeValue - 5); crossfader.value = crossfadeValue; applyAllVolumes(); }
                if (e.code === 'ArrowRight' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); crossfadeValue = Math.min(100, crossfadeValue + 5); crossfader.value = crossfadeValue; applyAllVolumes(); }
            });

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({ title:'Dual Video Player', artist:'YouTube Crossfader', artwork:[{ src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1c1c1e"/><text x="50" y="55" text-anchor="middle" fill="#f0f0f0" font-size="40">🎚️</text></svg>'), sizes:'100x100', type:'image/svg+xml' }] });
                navigator.mediaSession.setActionHandler('play', () => { if (!isPlaying) togglePlayPause(); });
                navigator.mediaSession.setActionHandler('pause', () => { if (isPlaying) togglePlayPause(); });
            }

            let bgInterval = null;
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    if (!bgInterval) bgInterval = setInterval(() => {
                        if (!isPlaying) { clearInterval(bgInterval); bgInterval = null; return; }
                        if (player1 && typeof player1.getPlayerState === 'function' && player1.getPlayerState() !== 1 && player1.getPlayerState() !== 3) player1.playVideo();
                        if (player2 && typeof player2.getPlayerState === 'function' && player2.getPlayerState() !== 1 && player2.getPlayerState() !== 3) player2.playVideo();
                        applyAllVolumes();
                    }, 1500);
                } else { if (bgInterval) { clearInterval(bgInterval); bgInterval = null; } applyAllVolumes(); updateStatusBadge(); }
            });

            updateVolumeDisplay(); updateMiddleHighlight();
            if (window.YT && window.YT.Player) { apiReady = true; statusBadge.textContent = '✅ Bereit – Videos laden'; statusBadge.className = 'badge'; }
        })();
    </script>
</body>
</html>
